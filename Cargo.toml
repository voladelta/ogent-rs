[package]
name = "ogent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
ignore = "0.4.25"
globset = "0.4.18"
mimalloc = "0.1"
mlua = { version = "0.11", features = ["lua55", "vendored", "async", "serde", "anyhow", "send"] }
parking_lot = "0.12"
reqwest = { version = "0.13", features = ["json", "stream"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
similar = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time"] }
tokio-util = "0.7"
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
panic = "abort"
strip = "symbols"
