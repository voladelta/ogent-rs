[package]
name = "ogent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
mimalloc = "0.1"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "hashline_bench"
harness = false

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
panic = "abort"
strip = "symbols"
