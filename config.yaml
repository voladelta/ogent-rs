    max_tokens: 393216
  ds-flash-max:
    backend: deepseek
    model: deepseek-v4-flash
    effort: max
    context_limit: 1000000
    max_tokens: 393216
  ds-pro:
    backend: deepseek
    model: deepseek-v4-pro
    effort: high
    context_limit: 1000000
    max_tokens: 393216
