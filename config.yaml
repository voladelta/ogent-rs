  glm:
    backend: z
    model: glm-5.2
    effort: high
    context_limit: 200000
    max_tokens: 131072
  glm-max:
    backend: z
    model: glm-5.2
    effort: max
    context_limit: 200000
    max_tokens: 131072
  mimo:
    backend: xaomi
    model: mimo-v2.5
    effort: ""
    context_limit: 1000000
