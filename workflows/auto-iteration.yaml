id: auto-iteration
name: Auto Iteration
version: 1
start: frame
instructions: |
  Use this workflow for bounded optimization or research loops with measurable outcomes.
  Keep the evaluation protocol fixed after baseline. Record every keep/discard decision with evidence.
  Do not continue forever: stop at the target, budget, or max loop visits.
steps:
  frame:
    title: Frame
    instructions: |
      Define the objective metric, target, guardrails, editable surface, sacred surface,
      evaluation command, loop budget, and ledger path.
    next: [baseline]
    checks:
      - id: objective
        type: manual
        required: true
      - id: protocol
        type: manual
        required: true
  baseline:
    title: Baseline
    instructions: |
      Measure the unchanged current state with the fixed protocol.
      Record baseline metric and guardrails before proposing changes.
    next: [propose]
    checks:
      - id: baseline
        type: manual
        required: true
  propose:
    title: Propose
    instructions: |
      Choose one narrow, falsifiable hypothesis. Avoid repeating failed ideas.
    next: [implement]
    checks:
      - id: hypothesis
        type: manual
        required: true
  implement:
    title: Implement
    instructions: |
      Implement only the selected hypothesis. Do not modify the evaluation harness,
      data snapshot, metric parser, ledger history, or other sacred surfaces.
    next: [evaluate]
    checks:
      - id: candidate
        type: manual
        required: true
  evaluate:
    title: Evaluate
    instructions: |
      Run verification and the fixed evaluation protocol. Record raw metric evidence.
      If the run is invalid, go to fix. If valid, go to decide.
    next: [fix, decide]
    gate: true
    checks:
      - id: metric_result
        type: manual
        required: true
  fix:
    title: Fix
    instructions: |
      Repair an invalid candidate run without changing the hypothesis or protocol.
      Return to evaluate after the smallest fix.
    next: [evaluate]
    max_visits: 5
    checks:
      - id: fix_reason
        type: manual
        required: true
  decide:
    title: Decide
    instructions: |
      Decide keep, discard, retry, or simplify. Keep only if metric improvement,
      guardrails, verification, and complexity all justify it. Update the ledger.
      If the target is reached or budget is exhausted, go to report.
    next: [propose, report]
    gate: true
    checks:
      - id: decision
        type: manual
        required: true
      - id: ledger
        type: manual
        required: true
  report:
    title: Report
    instructions: |
      Summarize baseline, best result, trials, accepted/rejected ideas, evidence,
      limitations, and the next best experiment.
    terminal: true
