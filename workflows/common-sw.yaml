id: common-sw
name: Common Software Work
version: 1
start: intake
instructions: |
  Use this workflow to keep software work bounded, verified, and reviewable.
  Keep evidence concrete. Waive checks only with reason and risk.
steps:
  intake:
    title: Intake
    instructions: |
      Understand the request, scope, relevant files, and verification path.
    next: [execute]
    checks:
      - id: scope
        type: manual
        required: true
  execute:
    title: Execute
    instructions: |
      Do the requested work: code, review, debug, document, or analyze.
    next: [verify]
    checks:
      - id: work_done
        type: manual
        required: true
  verify:
    title: Verify
    instructions: |
      Run the relevant check or record why it cannot be run.
    next: [repair, review]
    gate: true
    checks:
      - id: verification
        type: manual
        required: true
  repair:
    title: Repair
    instructions: |
      Fix failed verification. Keep changes narrow.
    next: [verify]
    max_visits: 5
  review:
    title: Review
    instructions: |
      Review final diff/output for correctness, scope, and residual risk.
    next: [execute, done]
    gate: true
    checks:
      - id: self_review
        type: manual
        required: true
  done:
    title: Done
    terminal: true
